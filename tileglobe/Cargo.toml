[package]
name = "tileglobe"
version = "0.1.0"
edition.workspace = true

[dependencies]
embassy-executor = { workspace = true }
embassy-sync = { workspace = true }
embedded-io-async = { workspace = true }

libm = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
derive_more = { workspace = true, features = ["debug", "display", "from", "into", "deref", "deref_mut"] }
uuid = { workspace = true }
num-traits = { workspace = true }
dynify = { workspace = true }
smallvec = { workspace = true }
itertools = { workspace = true }
ordered-float = { version = "5.1.0", default-features = false }

pymeta = { workspace = true }

defmt-or-log = { workspace = true }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }

embassy-rp = { version = "0.10.0", path = "../embassy/embassy-rp", features = [
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "binary-info",
    "defmt"
], optional = true }

[features]
defmt = ["dep:defmt", "defmt-or-log/defmt"]
log = ["dep:log", "defmt-or-log/log"]
rp = ["dep:embassy-rp"]