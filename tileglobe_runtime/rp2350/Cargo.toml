[package]
name = "tileglobe_runtime_rp2350"
version = "0.1.0"
edition.workspace = true
#forced-target = "thumbv8m.main-none-eabihf"

[[bin]]
name = "tileglobe_runtime_rp2350"
path = "src/main.rs"
test = false
bench = false

[dependencies]
tileglobe = { path = "../../tileglobe", features = ["defmt", "rp"] }
tileglobe_server = { path = "../../tileglobe_server", features = ["defmt"] }

embassy-executor = { workspace = true, features = [
    "platform-cortex-m",
    "executor-interrupt",
    "defmt"
] }
embassy-time = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-futures = { workspace = true }
embassy-rp = { version = "0.10.0", path = "../../embassy/embassy-rp", features = [
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "binary-info",
    "defmt"
] }
embassy-net = { workspace = true, features = ["defmt"] }
#embassy-net-esp-hosted = { version = "0.2.1", path = "../../embassy/embassy-net-esp-hosted", features = ["defmt"] }

static_cell = { workspace = true }
heapless = { workspace = true }
dynify = { workspace = true }

defmt = { workspace = true }

embedded-alloc = "0.7.0"

defmt-rtt = "1.3.1"

cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cyw43 = { version = "0.7.0", path = "../../embassy/cyw43", features = ["defmt", "firmware-logs"], optional = true }
cyw43-pio = { version = "0.10.0", path = "../../embassy/cyw43-pio", features = ["defmt"], optional = true }
embassy-usb = { version = "0.6.0", path = "../../embassy/embassy-usb", features = ["defmt"], optional = true }
log = "0.4.34"

pymeta = { workspace = true }

[package.metadata.embassy]
build = [
    { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/rp2350" }
]

[features]
default = ["rp2350b"]
rp2350a = ["embassy-rp/rp235xa"]
rp2350b = ["embassy-rp/rp235xb"]
net_cyw43 = ["cyw43", "cyw43-pio"]
net_usb = ["embassy-usb"]